function forgot(){if(!confirm('Xóa TẤT CẢ tài khoản quản trị để tạo lại Super Admin mới?\nDữ liệu người chơi, giao dịch, bàn chơi được giữ nguyên.'))return;S.admins=[];save();sessionStorage.clear();lh.textContent='🎉 Nhập tài khoản và mật khẩu mới (≥ 6 ký tự) để tạo Super Admin';lu.value='';lp.value='';lu.focus()}
async function login(){const u=lu.value.trim().toLowerCase(),p=lp.value.trim();if(!S.admins.length){if(!/^[a-z0-9_.]{3,30}$/.test(u)||p.length<6)return toast('Tài khoản 3-30 ký tự (a-z, 0-9), mật khẩu ≥ 6 ký tự');S.admins.push({id:1,username:u,hash:await sha(p),role:'super',locked:0,last:0});save()}const a=S.admins.find(x=>x.username==u&&!x.locked);if(!a||a.hash!=await sha(p))return toast('Sai tài khoản hoặc mật khẩu');a.last=Date.now();me=a;sessionStorage.ott_me=a.id;log('Đăng nhập');start()}

const inR=(t,d)=>d==1?new Date(t).toDateString()==new Date().toDateString():t>=Date.now()-d*D,done=()=>S.tx.filter(t=>t.status=='done');
const sum=(ty,d,k='amount')=>done().filter(t=>(!ty||t.type==ty)&&inR(t.t,d)).reduce((a,t)=>a+t[k],0);
const cmp=(ty,d,k)=>{const a=sum(ty,d,k),b=done().filter(t=>(!ty||t.type==ty)&&t.t<Date.now()-d*D&&t.t>=Date.now()-2*d*D).reduce((x,t)=>x+t[k||'amount'],0);const p=b?(a-b)/b*100:0;return`<span class="${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`};
const rev=d=>sum('deposit',d,'fee')+sum('transfer',d,'fee');
let ci=0;function C(t,v,ic,c,m=1){let y=14,p='M0 '+y;for(let i=1;i<=7;i++){y=Math.max(3,Math.min(26,y+rnd(-9,8)));p+=' L'+i*16.6+' '+y}return`<div class="card c${ci++%5}"><span class="ic"><i data-lucide="${ic}"></i></span><small>${t}</small><b class="n" data-n="${v}" data-m="${m}">0</b>${c||''}</div>`}

function series(d){const days=Math.min(d,30),L=[],A=[],B=[],R=[];for(let i=days-1;i>=0;i--){const day=new Date(Date.now()-i*D).toDateString(),x=done().filter(t=>new Date(t.t).toDateString()==day);L.push(new Date(Date.now()-i*D).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}));A.push(x.filter(t=>t.type=='deposit').reduce((a,t)=>a+t.amount,0));B.push(x.filter(t=>t.type=='withdraw').reduce((a,t)=>a+t.amount,0));R.push(x.reduce((a,t)=>a+t.fee,0))}return{L,A,B,R}}

ana(){const ty=['deposit','withdraw','transfer'].map(t=>S.tx.filter(x=>x.type==t&&inR(x.t,rng)).length);return`<div class="bar">${rsel()}</div><div class="grid">${C('Người chơi',S.players.length,'users','',0)}${C('Tỷ lệ hoạt động',S.players.filter(p=>p.status=='active').length/(S.players.length||1)*100,'percent','',0)}${C('Giao dịch',ty.reduce((a,b)=>a+b),'repeat','',0)}${C('Tăng trưởng nạp',sum('deposit',rng),'trending-up',cmp('deposit',Math.min(rng,365)))}</div><div class="two"><div class="card" style="height:300px"><canvas id="c1"></canvas></div><div class="card" style="height:300px"><canvas id="c2"></canvas></div></div>`},
after_ana(){const ty=['deposit','withdraw','transfer'].map(t=>S.tx.filter(x=>x.type==t&&inR(x.t,rng)).length),s=series(rng);chart('c1','doughnut',['Nạp','Rút','Chuyển'],[{data:ty,backgroundColor:['#ec4899','#f59e0b','#8b5cf6'],borderWidth:0}]);chart('c2','line',s.L,[ds('Nạp',s.A,'#ec4899'),ds('Rút',s.B,'#f59e0b')])},
players(){return table(['ID','Tên','Tài khoản','Số dư','Đã nạp','Đã rút','Ngày tham gia','TT',''],S.players.map(p=>[p.name+p.account,`<tr><td>${p.id}</td><td><span class="av">${p.name.slice(-1).toUpperCase()}</span>${p.name}${dm(p)}</td><td>${p.account}</td><td>${f(p.balance)}</td><td>${f(S.tx.filter(t=>t.pid==p.id&&t.type=='deposit'&&t.status=='done').reduce((a,t)=>a+t.amount,0))}</td><td>${f(S.tx.filter(t=>t.pid==p.id&&t.type=='withdraw'&&t.status=='done').reduce((a,t)=>a+t.amount,0))}</td><td>${new Date(p.joined).toLocaleDateString('vi-VN')}</td><td>${tag(p.status)}</td><td><button class="g s" onclick="lockP(${p.id})">🔒 Khóa/Mở</button> <button class="g s" onclick="adjP(${p.id})">💰 Số dư</button> <button class="g s" onclick="editP(${p.id})">✏️ Sửa</button></td></tr>`]),'<button onclick="editP()">➕ Thêm người chơi</button>')},
tables(){return table(['Mã','Tên','Người','Tổng tiền','TT',''],S.tables.map(t=>[t.code+t.name,`<tr><td>${t.code}</td><td>${t.name}${dm(t)}</td><td>${t.users}</td><td>${f(t.pot)}</td><td>${tag(t.active?'active':'locked')}</td><td><button class="g s" onclick="togT(${t.id})">🔌 Bật/Tắt</button> <button class="g s" onclick="editT(${t.id})">✏️ Sửa</button> <button class="r s" onclick="delT(${t.id})">🗑️ Xóa</button></td></tr>`]),'<button onclick="editT()">➕ Thêm bàn</button>')},
fee(){const r=done().filter(t=>t.fee>0).sort((a,b)=>b.t-a.t);return`<div class="grid">${C('Phí hôm nay',sum(0,1,'fee'),'coins')}${C('Phí tuần',sum(0,7,'fee'),'coins')}${C('Phí tháng',sum(0,30,'fee'),'coins')}</div><div class="card" style="margin-bottom:16px"><b class="hd">BIỂU PHÍ TRUNG GIAN</b><div style="line-height:2">${feeText()}</div><small>Đổi tại Cài đặt hệ thống</small></div>`+table(['Mã','Giao dịch','Số tiền','Tỷ lệ','Phí','Thời gian'],r.map(t=>[pn(t.pid),`<tr><td>#${t.id}</td><td>${t.type}${dm(t)}</td><td>${f(t.amount)}</td><td>${(t.fee/t.amount*100).toFixed(1)}%</td><td>${f(t.fee)}</td><td>${fd(t.t)}</td></tr>`]))},
logs(){return table(['Người thực hiện','Hành động','Nội dung','Thời gian'],S.logs.map(l=>[l.who+l.a+l.d,`<tr><td>${l.who}</td><td>${l.a}</td><td>${l.d}</td><td>${fd(l.t)}</td></tr>`]))},
admins(){return table(['Tài khoản','Quyền','Đăng nhập cuối','TT',''],S.admins.map(a=>[a.username,`<tr><td>${a.username}</td><td>${a.role}</td><td>${a.last?fd(a.last):'-'}</td><td>${tag(a.locked?'locked':'active')}</td><td><button class="g s" onclick="lockA(${a.id})">🔒 Khóa/Mở</button> <button class="g s" onclick="roleA(${a.id})">🛡️ Quyền</button></td></tr>`]),'<button onclick="addA()">➕ Thêm Admin</button>')},
set(){return`<div class="card box"><label>Biểu phí (mỗi dòng: số tiền từ : phí)</label><textarea id="sf" rows="4" style="background:var(--card);border:1.5px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px;font:inherit">${tiers().map(x=>x.join(':')).join('\n')}</textarea><label>Tối đa mỗi lần chơi (đ)</label><input id="sm" value="${MAX()}"><label>Mục tiêu doanh thu ngày</label><input id="sg" value="${S.set.goal}"><button onclick="saveSet()">💾 Lưu</button><button class="g" onclick="chgPw()">🔑 Đổi mật khẩu của tôi</button><button class="g" onclick="bk()">💾 Sao lưu dữ liệu (JSON)</button><button class="r" onclick="clearDemo()">🧹 Xóa toàn bộ dữ liệu</button></div>`}};
for(const t of ['deposit','withdraw','transfer'])P[t]=()=>{const r=S.tx.filter(x=>x.type==t).sort((a,b)=>b.t-a.t),pd=r.filter(x=>x.status=='pending').length;return`<div class="grid">${C('Tổng đã xử lý',r.filter(x=>x.status=='done').reduce((a,x)=>a+x.amount,0),'sigma')}${C('Đang chờ',pd,'clock','',0)}</div>`+table(['Mã','Người chơi','Số tiền','Phương thức','Thời gian','Trạng thái',''],r.map(x=>[pn(x.pid)+x.id,`<tr><td>#${x.id}</td><td>${pn(x.pid)}${x.to?' → '+pn(x.to):''}${dm(x)}</td><td>${f(x.amount)}</td><td>${x.method}</td><td>${fd(x.t)}</td><td>${tag(x.status)}</td><td>${x.status=='pending'?`<button class="o s" onclick="txa(${x.id},1)">✅ Duyệt</button> <button class="r s" onclick="txa(${x.id},0)">❌ Từ chối</button>`:''}</td></tr>`]),t!='transfer'?`<button onclick="newTx('${t}')">➕ Tạo yêu cầu</button>`:`<button onclick="newTr()">➕ Tạo chuyển tiền</button>`)};
async function go(k,keep){if(!keep){q='';pg=1}cur=k;sb.classList.remove('open');ch.forEach(c=>c.destroy());ch=[];ci=0;document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));{const m=MENU.flatMap(x=>x[1]).find(x=>x[0]==k);$('#ttl').textContent=(EM[m[2]]||'')+' '+m[1]}
 if(!keep){v.innerHTML='<div class="sk"></div><div class="sk"></div>';await new Promise(r=>setTimeout(r,220))}
 v.innerHTML='<div class="view">'+P[k]()+'</div>';P['after_'+k]?.();cnt();const pd=S.tx.filter(t=>t.status=='pending');['deposit','withdraw'].forEach(x=>{const n=pd.filter(t=>t.type==x).length,b=$('#b'+x);b.hidden=!n;b.textContent=n});{const b=$('#btables'),n=S.tables.filter(t=>t.active).length;b.hidden=!n;b.textContent=n;b.className='bd gr'}document.querySelectorAll('#bn a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));icons();const s=$('#sq');if(s&&keep){s.focus();s.setSelectionRange(99,99)}}
/* ===== THAO TÁC ===== */
function txa(id,ok){if(!can(['super','admin']))return;askOk((ok?'Duyệt':'Từ chối')+' giao dịch #'+id+'?',()=>{const t=S.tx.find(x=>x.id==id),p=S.players.find(x=>x.id==t.pid);
 if(ok){const d=t.type=='deposit'?t.amount-t.fee:-t.amount;if(p.balance+d<0)return toast('Số dư không đủ');p.balance+=d}t.status=ok?'done':'rejected';log((ok?'Duyệt ':'Từ chối ')+t.type,'#'+id);toast('Thành công');go(cur,1)})}
function newTx(ty){modal('Tạo yêu cầu '+ty,[['pid','ID người chơi',1],['amount','Số tiền',100000],['method','Phương thức',['Bank','Momo','ZaloPay'],'sel']],o=>{const a=+o.amount;if(!pn(o.pid)||pn(o.pid)=='?'||a<=0)return toast('Dữ liệu không hợp lệ');if(a>MAX())return toast('Tối đa '+f(MAX())+' mỗi lần');S.tx.push({id:Math.max(0,...S.tx.map(x=>x.id))+1,type:ty,pid:+o.pid,to:0,amount:a,fee:ty=='deposit'?feeOf(a):0,method:o.method,status:'pending',t:Date.now()});log('Tạo yêu cầu '+ty);go(cur,1)})}
function newTr(){if(!can(['super','admin']))return;modal('Tạo chuyển tiền',[['a','ID người gửi',''],['b','ID người nhận',''],['m','Số tiền','']],o=>{const A=S.players.find(x=>x.id==o.a),B=S.players.find(x=>x.id==o.b),m=+o.m,fee=feeOf(m);if(!A||!B||A==B||!(m>0))return toast('Dữ liệu không hợp lệ');if(m>MAX())return toast('Tối đa '+f(MAX())+' mỗi lần');if(A.balance<m)return toast('Số dư người gửi không đủ');A.balance-=m;B.balance+=m-fee;S.tx.push({id:Math.max(0,...S.tx.map(x=>x.id))+1,type:'transfer',pid:A.id,to:B.id,amount:m,fee,method:'Nội bộ',status:'done',t:Date.now()});log('Chuyển tiền',`${A.name} → ${B.name}: ${m}`);go(cur,1)})}
function chgPw(){modal('Đổi mật khẩu',[['p','Mật khẩu mới (≥ 6 ký tự)','']],async o=>{if(o.p.length<6)return toast('Mật khẩu quá ngắn');S.admins.find(a=>a.id==me.id).hash=await sha(o.p);log('Đổi mật khẩu');toast('Đã đổi mật khẩu')})}
function lockP(id){if(!can(['super','admin']))return;const p=S.players.find(x=>x.id==id);p.status=p.status=='active'?'locked':'active';log('Khóa/mở người chơi',p.name);go(cur,1)}
function adjP(id){if(!can(['super','admin']))return;modal('Điều chỉnh số dư '+pn(id),[['a','Số tiền (+/-)',0],['n','Lý do','']],o=>{const p=S.players.find(x=>x.id==id);if(!o.n)return toast('Cần nhập lý do');p.balance=Math.max(0,p.balance+ +o.a);log('Điều chỉnh số dư',`${p.name} ${o.a} (${o.n})`);go(cur,1)})}
function editP(id){if(!can(['super','admin']))return;const p=S.players.find(x=>x.id==id)||{};modal(id?'Sửa người chơi':'Thêm người chơi',[['name','Tên',p.name],['account','SĐT/Tài khoản',p.account]],o=>{if(!o.name)return toast('Thiếu tên');if(id){p.name=o.name;p.account=o.account}else S.players.push({id:Math.max(0,...S.players.map(x=>x.id))+1,name:o.name,account:o.account,balance:0,status:'active',joined:Date.now()});log(id?'Sửa người chơi':'Thêm người chơi',o.name);go(cur,1)})}
function editT(id){if(!can(['super','admin']))return;const t=S.tables.find(x=>x.id==id)||{};modal(id?'Sửa bàn':'Thêm bàn',[['code','Mã bàn',t.code],['name','Tên bàn',t.name]],o=>{if(id){t.code=o.code;t.name=o.name}else S.tables.push({id:Math.max(0,...S.tables.map(x=>x.id))+1,code:o.code,name:o.name,users:0,pot:0,active:1});log('Lưu bàn',o.name);go(cur,1)})}
const togT=id=>{if(!can(['super','admin']))return;const t=S.tables.find(x=>x.id==id);t.active=t.active?0:1;log('Bật/tắt bàn',t.name);go(cur,1)};
const delT=id=>{if(!can(['super']))return;askOk('Xóa bàn này?',()=>{S.tables=S.tables.filter(x=>x.id!=id);log('Xóa bàn',id);go(cur,1)})};
function addA(){if(!can(['super']))return;modal('Thêm Admin',[['u','Tài khoản',''],['p','Mật khẩu (≥6 ký tự)',''],['r','Quyền',['admin','support','super'],'sel']],async o=>{if(!o.u||o.p.length<6||S.admins.some(a=>a.username==o.u))return toast('Dữ liệu không hợp lệ');S.admins.push({id:Math.max(...S.admins.map(a=>a.id))+1,username:o.u,hash:await sha(o.p),role:o.r,locked:0,last:0});log('Thêm admin',o.u);go(cur,1)})}
const lockA=id=>{if(!can(['super']))return;const a=S.admins.find(x=>x.id==id);if(a.id==me.id)return toast('Không thể tự khóa');a.locked=a.locked?0:1;log('Khóa/mở admin',a.username);go(cur,1)};
const roleA=id=>{if(!can(['super']))return;modal('Phân quyền',[['r','Quyền',['super','admin','support'],'sel']],o=>{S.admins.find(x=>x.id==id).role=o.r;log('Đổi quyền admin',id+' → '+o.r);go(cur,1)})};
const setGoal=()=>{if(!can(['super','admin']))return;modal('Mục tiêu doanh thu ngày',[['g','Số tiền',S.set.goal]],o=>{S.set.goal=+o.g||S.set.goal;log('Đổi mục tiêu ngày',o.g);go('home')})};
const saveSet=()=>{if(!can(['super']))return;const tr=sf.value.split('\n').map(l=>l.split(':').map(x=>+x.replace(/\D/g,''))).filter(x=>x.length==2&&x[0]>0&&x[1]>=0);if(!tr.length)return toast('Biểu phí không hợp lệ (vd: 20000:1000)');S.set.tiers=tr;S.set.max=+sm.value.replace(/\D/g,'')||1e8;S.set.goal=+sg.value;log('Thay đổi cài đặt');toast('Đã lưu')};
const bk=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tgbtl-ott-backup.json';a.click();log('Sao lưu dữ liệu')};
const clearDemo=()=>{if(!can(['super']))return;askOk('XÓA TOÀN BỘ người chơi, giao dịch, bàn chơi? Không thể hoàn tác.',()=>{S.players=[];S.tx=[];S.tables=[];log('Xóa toàn bộ dữ liệu');toast('Đã xóa');go('home')})};
lh.textContent=S.admins.length?'Nhận TG uy tín 💖':'🎉 Lần đầu sử dụng: nhập tài khoản và mật khẩu (≥ 6 ký tự) để tạo Super Admin';if(sessionStorage.ott_me){me=S.admins.find(a=>a.id==sessionStorage.ott_me);me?start():0}icons();
</script></body></html>
